# Qwen3.8-Flash-Next (official NVIDIA NVFP4 checkpoint) on 2x RTX PRO 6000 Blackwell.
# Tested with vLLM v0.30.0 on 2026-09-22. See README.md for why each flag is there.
services:
  vllm:
    image: vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
    entrypoint: ["vllm", "serve"]
    user: "0:0"              # per-layer embedding CPU offload needs root ...
    cap_add: [SYS_PTRACE]    # ... and SYS_PTRACE (CUDA IPC between worker processes)
    ipc: host
    ports:
      - "8000:8000"
    volumes:
      - ./hf-cache:/hf-cache
      - ./chat_template/qwen38_flash_next.jinja:/templates/qwen38_flash_next.jinja:ro
    environment:
      HF_HOME: /hf-cache
      VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY before starting}
      VLLM_PLE_CPU_OFFLOAD: "1"
      VLLM_USE_DEEP_GEMM: "0"
      VLLM_MOE_USE_DEEP_GEMM: "0"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      CUDA_DEVICE_ORDER: PCI_BUS_ID
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1"]   # exactly two GPUs; change the indices if needed
              capabilities: [gpu]
    restart: unless-stopped
    command:
      - --model
      - nvidia/Qwen3.8-Flash-Next-NVFP4
      - --served-model-name
      - qwen3.8-flash-next
      - --gpu-memory-utilization
      - "0.95"
      - --max-model-len
      - "262144"
      - --max-num-seqs
      - "32"
      - --tensor-parallel-size
      - "2"
      - --speculative-config
      - '{"method": "mtp", "num_speculative_tokens": 3, "draft_sample_method": "probabilistic"}'
      - --revision
      - fc694b54fb0174e0913e6adf86691ef85a4ead47
      - --code-revision
      - fc694b54fb0174e0913e6adf86691ef85a4ead47
      - --tokenizer-revision
      - fc694b54fb0174e0913e6adf86691ef85a4ead47
      - --quantization
      - modelopt
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --enable-auto-tool-choice
      - --chat-template
      - /templates/qwen38_flash_next.jinja
      - --trust-remote-code
      - --enable-expert-parallel
      - --disable-custom-all-reduce
      - --no-enable-flashinfer-autotune
      - --max-num-batched-tokens
      - "4096"
      - --compilation-config
      - '{"mode":"NONE","cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4,8,12,16,20,24,28,32,40,48,56,64,80,96,112,128],"inductor_compile_config":{"triton.autotune_at_compile_time":false}}'
